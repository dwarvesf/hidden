<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Shared look for the App Store preview videos (Hidden Bar and Blurred): 135deg two-stop
         gradient, Inter 600, same card shadow and radius, same caption pill position. */
      :root {
        --g1: #3b2fb8;
        --g2: #8b5cf6;
        --ink: #ffffff;
        --pill: rgba(18, 12, 48, 0.66);
        --font-display: "Inter", "SF Pro Display", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--g1); }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: var(--font-display);
        font-weight: 600;
        color: var(--ink);
        background: linear-gradient(135deg, var(--g1) 0%, var(--g2) 100%);
      }
      .fill { position: absolute; inset: 0; }
      .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

      .icon { width: 230px; height: 230px; border-radius: 52px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); }
      .name { font-size: 124px; letter-spacing: -0.03em; margin-top: 44px; line-height: 1.05; }
      .pitch { font-size: 46px; font-weight: 600; opacity: 0.86; margin-top: 18px; letter-spacing: -0.01em; }

      .card {
        position: absolute;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        background: #1d4f73;
      }
      .card video { position: absolute; left: 0; top: 0; display: block; }
      #cardA { left: 160px; top: 250px; width: 1600px; height: 340px; }
      #cardB { left: 213px; top: 60px; width: 1494px; height: 840px; }
      #cardA video { width: 1600px; height: 340px; }
      #cardB video { width: 1494px; height: 840px; }

      .capwrap { position: absolute; left: 0; width: 1920px; bottom: 74px; display: flex; justify-content: center; }
      .cap {
        font-size: 42px;
        letter-spacing: -0.01em;
        padding: 18px 40px 20px;
        border-radius: 999px;
        background: var(--pill);
        white-space: nowrap;
      }

      .endname { font-size: 92px; letter-spacing: -0.03em; line-height: 1.08; margin-top: 40px; }
      .wordmark { font-size: 34px; letter-spacing: 0.32em; text-transform: uppercase; opacity: 0.8; margin-top: 34px; font-weight: 600; }
      .icon-sm { width: 150px; height: 150px; border-radius: 34px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.3" data-width="1920" data-height="1080">

      <div id="title" class="clip fill" data-start="0" data-duration="2.0" data-track-index="0">
        <div id="titleIn" class="fill center">
          <img class="icon" src="assets/icon.png" alt="Hidden Bar icon" />
          <div class="name">Hidden Bar</div>
          <div class="pitch">Keep your menu bar tidy.</div>
        </div>
      </div>

      <div id="beatA" class="fill">
        <div id="cardA" class="card">
          <video id="vidA" class="clip" data-start="2.0" data-duration="14.0" data-track-index="2" src="assets/clipA.mp4" muted playsinline></video>
        </div>
      </div>

      <div id="beatB" class="fill">
        <div id="cardB" class="card">
          <video id="vidB" class="clip" data-start="16.0" data-duration="6.1" data-track-index="2" src="assets/clipB.mp4" muted playsinline></video>
        </div>
      </div>

      <div id="cap1" class="clip capwrap" data-start="2.2" data-duration="2.4" data-track-index="3"><div class="cap" id="cap1In">Icons tuck behind one arrow</div></div>
      <div id="cap2" class="clip capwrap" data-start="4.8" data-duration="4.7" data-track-index="3"><div class="cap" id="cap2In">Click the arrow to show them</div></div>
      <div id="cap3" class="clip capwrap" data-start="9.7" data-duration="3.6" data-track-index="3"><div class="cap" id="cap3In">An always-hidden section</div></div>
      <div id="cap4" class="clip capwrap" data-start="13.5" data-duration="2.4" data-track-index="3"><div class="cap" id="cap4In">Click again to tuck them away</div></div>
      <div id="cap5" class="clip capwrap" data-start="16.2" data-duration="5.8" data-track-index="3"><div class="cap" id="cap5In">Make it yours in Settings</div></div>

      <div id="end" class="clip fill" data-start="22.1" data-duration="2.2" data-track-index="0">
        <div id="endIn" class="fill center">
          <img class="icon-sm" src="assets/icon.png" alt="" />
          <div class="endname">Free on the Mac App Store</div>
          <div class="wordmark">Dwarves Foundation</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // title card
      tl.fromTo("#titleIn", { y: 16 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.to("#titleIn", { opacity: 0, duration: 0.25, ease: "power2.in" }, 1.75);

      // footage cards
      tl.fromTo("#cardA", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.0);
      tl.to("#cardA", { opacity: 0, duration: 0.25, ease: "power2.in" }, 15.75);
      tl.fromTo("#cardB", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 16.0);
      tl.to("#cardB", { opacity: 0, duration: 0.25, ease: "power2.in" }, 21.85);

      // captions
      const caps = [["cap1In", 2.2, 2.4], ["cap2In", 4.8, 4.7], ["cap3In", 9.7, 3.6], ["cap4In", 13.5, 2.4], ["cap5In", 16.2, 5.8]];
      caps.forEach(([id, t, d]) => {
        tl.fromTo("#" + id, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);
        tl.to("#" + id, { opacity: 0, duration: 0.2, ease: "power2.in" }, t + d - 0.2);
      });

      // end card
      tl.fromTo("#endIn", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 22.1);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
