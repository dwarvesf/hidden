<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Shared look for the App Store preview videos (Hidden Bar and Blurred): 135deg two-stop
         gradient, Inter 600, same card shadow and radius, same caption pill position. */
      :root {
        --g1: #3b2fb8;
        --g2: #8b5cf6;
        --ink: #ffffff;
        --pill: rgba(18, 12, 48, 0.66);
        --font-display: "Inter", "SF Pro Display", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--g1); }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: var(--font-display);
        font-weight: 600;
        color: var(--ink);
        background: linear-gradient(135deg, var(--g1) 0%, var(--g2) 100%);
      }
      .fill { position: absolute; inset: 0; }
      .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

      .icon { width: 230px; height: 230px; border-radius: 52px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); }
      .name { font-size: 124px; letter-spacing: -0.03em; margin-top: 44px; line-height: 1.05; }
      .pitch { font-size: 46px; font-weight: 600; opacity: 0.86; margin-top: 18px; letter-spacing: -0.01em; }

      .card {
        position: absolute;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        background: #1d4f73;
      }
      .card video { position: absolute; left: 0; top: 0; display: block; }
      #cardA { left: 144px; top: 315px; width: 1632px; height: 330px; }
      #cardA video { width: 1632px; height: 330px; }
      /* Settings windows: the shared shadow sits on a wrapper, the card carries the window's corner shape
         (macOS radius about 50 source px). General shows the top of the window and fades out at the cut. */
      .win { position: absolute; filter: drop-shadow(0 30px 80px rgba(0, 0, 0, 0.35)); }
      .wcard { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .win video { position: absolute; left: 0; top: 0; display: block; width: 100%; height: 100%; }
      #winB1 { left: 240px; top: 56px; width: 1440px; height: 834px; }
      #winB1 .wcard { border-radius: 56px; -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 82%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0, #000 82%, transparent 100%); }
      #winB2 { left: 160px; top: 197px; width: 1600px; height: 626px; }
      #winB2 .wcard { border-radius: 62px; }
      #winB3 { left: 160px; top: 248px; width: 1600px; height: 524px; }
      #winB3 .wcard { border-radius: 62px; }

      .capwrap { position: absolute; left: 0; width: 1920px; bottom: 74px; display: flex; justify-content: center; }
      .cap {
        font-size: 42px;
        letter-spacing: -0.01em;
        padding: 18px 40px 20px;
        border-radius: 999px;
        background: var(--pill);
        white-space: nowrap;
      }

      .endname { font-size: 92px; letter-spacing: -0.03em; line-height: 1.08; margin-top: 40px; }
      .wordmark { font-size: 34px; letter-spacing: 0.32em; text-transform: uppercase; opacity: 0.8; margin-top: 34px; font-weight: 600; }
      .icon-sm { width: 150px; height: 150px; border-radius: 34px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="17.85" data-width="1920" data-height="1080">

      <div id="title" class="clip fill" data-start="0" data-duration="2.0" data-track-index="0">
        <div id="titleIn" class="fill center">
          <img class="icon" src="assets/icon.png" alt="Hidden Bar icon" />
          <div class="name">Hidden Bar</div>
          <div class="pitch">Keep your menu bar tidy.</div>
        </div>
      </div>

      <div id="beatA" class="fill">
        <div id="cardA" class="card">
          <video id="vidA1" class="clip" data-start="2.0" data-duration="1.8" data-track-index="2" src="assets/clipA1.mp4" muted playsinline></video>
          <video id="vidA2" class="clip" data-start="3.8" data-duration="2.25" data-track-index="2" src="assets/clipA2.mp4" muted playsinline></video>
          <video id="vidA3" class="clip" data-start="6.05" data-duration="2.3" data-track-index="2" src="assets/clipA3.mp4" muted playsinline></video>
          <video id="vidA4" class="clip" data-start="8.35" data-duration="1.7" data-track-index="2" src="assets/clipA4.mp4" muted playsinline></video>
        </div>
      </div>

      <div id="beatB" class="fill">
        <div id="winB1" class="win"><div class="wcard"><video id="vidB1" class="clip" data-start="10.05" data-duration="1.5" data-track-index="2" src="assets/clipB1.mp4" muted playsinline></video></div></div>
        <div id="winB2" class="win"><div class="wcard"><video id="vidB2" class="clip" data-start="11.55" data-duration="2.4" data-track-index="2" src="assets/clipB2.mp4" muted playsinline></video></div></div>
        <div id="winB3" class="win"><div class="wcard"><video id="vidB3" class="clip" data-start="13.95" data-duration="1.7" data-track-index="2" src="assets/clipB3.mp4" muted playsinline></video></div></div>
      </div>

      <div id="cap1" class="clip capwrap" data-start="2.1" data-duration="1.6" data-track-index="3"><div class="cap" id="cap1In">Icons tuck behind one arrow</div></div>
      <div id="cap2" class="clip capwrap" data-start="3.9" data-duration="2.05" data-track-index="3"><div class="cap" id="cap2In">Click the arrow to show them</div></div>
      <div id="cap3" class="clip capwrap" data-start="6.15" data-duration="2.1" data-track-index="3"><div class="cap" id="cap3In">An always-hidden section</div></div>
      <div id="cap4" class="clip capwrap" data-start="8.45" data-duration="1.5" data-track-index="3"><div class="cap" id="cap4In">Click again to tuck them away</div></div>
      <div id="cap5" class="clip capwrap" data-start="10.15" data-duration="5.4" data-track-index="3"><div class="cap" id="cap5In">Make it yours in Settings</div></div>

      <div id="end" class="clip fill" data-start="15.65" data-duration="2.2" data-track-index="0">
        <div id="endIn" class="fill center">
          <img class="icon-sm" src="assets/icon.png" alt="" />
          <div class="endname">Free on the Mac App Store</div>
          <div class="wordmark">Dwarves Foundation</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // title card
      tl.fromTo("#titleIn", { y: 16 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.to("#titleIn", { opacity: 0, duration: 0.25, ease: "power2.in" }, 1.75);

      // footage cards
      tl.fromTo("#cardA", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.0);
      tl.to("#cardA", { opacity: 0, duration: 0.2, ease: "power2.in" }, 9.85);
      [["winB1", 10.05, 1.5], ["winB2", 11.55, 2.4], ["winB3", 13.95, 1.7]].forEach(([id, t, d]) => {
        tl.fromTo("#" + id, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);
        tl.to("#" + id, { opacity: 0, duration: 0.15, ease: "power2.in" }, t + d - 0.15);
      });

      // captions
      const caps = [["cap1In", 2.1, 1.6], ["cap2In", 3.9, 2.05], ["cap3In", 6.15, 2.1], ["cap4In", 8.45, 1.5], ["cap5In", 10.15, 5.4]];
      caps.forEach(([id, t, d]) => {
        tl.fromTo("#" + id, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);
        tl.to("#" + id, { opacity: 0, duration: 0.2, ease: "power2.in" }, t + d - 0.2);
      });

      // end card
      tl.fromTo("#endIn", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 15.65);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
