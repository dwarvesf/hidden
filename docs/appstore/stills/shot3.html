<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hidden Bar screenshot 3</title>
<link rel="stylesheet" href="stills.css">
<style>
  /* Top of the General window (status card, "Your menu bar" preview, first toggles), cut after the
     Keyboard shortcut row and shown at x1.5 so body text is about 39 px on the 2880 canvas. */
  .shadow { filter: drop-shadow(0 30px 80px rgba(0, 0, 0, 0.35)); }
  .cropwin { width: 1920px; height: 1308px; overflow: hidden; border-radius: 75px 75px 44px 44px; }
  .cropwin img { display: block; width: 1920px; }
</style>
</head>
<body>
<div class="stage">
  <h1>Settings that stay simple</h1>
  <div class="media" style="padding-bottom: 40px;">
    <div class="shadow"><div class="cropwin"><img src="captures/window-general.png" alt="Top of the Hidden Bar General settings"></div></div>
  </div>
</div>
</body>
</html>
