<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hidden Bar screenshot 1</title>
<link rel="stylesheet" href="stills.css">
</head>
<body>
<div class="stage">
  <h1>Hide menu bar clutter</h1>
  <div class="media">
    <div class="group">
      <div class="label">Tucked away</div>
      <img class="strip" src="captures/strip-collapsed.png" alt="Menu bar with icons hidden behind the arrow">
    </div>
    <div class="group">
      <div class="label">One click to show them</div>
      <img class="strip" src="captures/strip-expanded.png" alt="Menu bar with the hidden icons shown">
    </div>
  </div>
</div>
</body>
</html>
