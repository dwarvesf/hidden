name: Build

on:
  push:
    branches:
      - agent/notch-overflow-bar
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Hidden Bar
        run: >-
          xcodebuild
          -project "Hidden Bar.xcodeproj"
          -scheme "Hidden Bar"
          -configuration Debug
          -destination "platform=macOS"
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "build/DerivedData/Build/Products/Debug/Hidden Bar.app"
          Hidden-Bar-notch-overflow.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hidden-Bar-notch-overflow
          path: Hidden-Bar-notch-overflow.zip
          if-no-files-found: error
